[package]
name = "hippo"
version = "0.2.0"
description = "Config dashboard for Claude Code, Cursor and other coding agents"
authors = ["gregbanks"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.10.3", features = ["tray-icon"] }
log = "0.4"
tauri-plugin-log = "2"
tempfile = "3"
regex = "1"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
