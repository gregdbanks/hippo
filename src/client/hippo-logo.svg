<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 32x32 pixel art hippo — each rect is one "pixel" -->
  <!-- Palette: body #6ea8fe, dark #5a9aef, highlight #85b8ff, bg #0d1117, eye #f0f6fc, nose #0d1117 -->

  <!-- Row 5-6: Ears -->
  <rect x="7" y="5" width="1" height="1" fill="#5a9aef"/>
  <rect x="8" y="5" width="1" height="1" fill="#5a9aef"/>
  <rect x="22" y="5" width="1" height="1" fill="#5a9aef"/>
  <rect x="23" y="5" width="1" height="1" fill="#5a9aef"/>
  <rect x="7" y="6" width="1" height="1" fill="#85b8ff"/>
  <rect x="8" y="6" width="1" height="1" fill="#5a9aef"/>
  <rect x="22" y="6" width="1" height="1" fill="#5a9aef"/>
  <rect x="23" y="6" width="1" height="1" fill="#85b8ff"/>

  <!-- Row 7-8: Top of head -->
  <rect x="9" y="7" width="14" height="1" fill="#6ea8fe"/>
  <rect x="8" y="7" width="1" height="1" fill="#6ea8fe"/>
  <rect x="23" y="7" width="1" height="1" fill="#6ea8fe"/>
  <rect x="8" y="8" width="16" height="1" fill="#6ea8fe"/>

  <!-- Row 9: Head with eyes -->
  <rect x="8" y="9" width="2" height="1" fill="#6ea8fe"/>
  <rect x="10" y="9" width="2" height="1" fill="#0d1117"/>
  <rect x="12" y="9" width="8" height="1" fill="#6ea8fe"/>
  <rect x="20" y="9" width="2" height="1" fill="#0d1117"/>
  <rect x="22" y="9" width="2" height="1" fill="#6ea8fe"/>

  <!-- Row 10: Eyes with highlights -->
  <rect x="8" y="10" width="2" height="1" fill="#6ea8fe"/>
  <rect x="10" y="10" width="1" height="1" fill="#f0f6fc"/>
  <rect x="11" y="10" width="1" height="1" fill="#0d1117"/>
  <rect x="12" y="10" width="8" height="1" fill="#6ea8fe"/>
  <rect x="20" y="10" width="1" height="1" fill="#f0f6fc"/>
  <rect x="21" y="10" width="1" height="1" fill="#0d1117"/>
  <rect x="22" y="10" width="2" height="1" fill="#6ea8fe"/>

  <!-- Row 11: Below eyes -->
  <rect x="8" y="11" width="16" height="1" fill="#6ea8fe"/>

  <!-- Row 12-13: Snout -->
  <rect x="7" y="12" width="1" height="1" fill="#6ea8fe"/>
  <rect x="8" y="12" width="1" height="1" fill="#85b8ff"/>
  <rect x="9" y="12" width="14" height="1" fill="#85b8ff"/>
  <rect x="23" y="12" width="1" height="1" fill="#85b8ff"/>
  <rect x="24" y="12" width="1" height="1" fill="#6ea8fe"/>

  <rect x="7" y="13" width="1" height="1" fill="#6ea8fe"/>
  <rect x="8" y="13" width="2" height="1" fill="#85b8ff"/>
  <rect x="10" y="13" width="2" height="1" fill="#0d1117"/>
  <rect x="12" y="13" width="8" height="1" fill="#85b8ff"/>
  <rect x="20" y="13" width="2" height="1" fill="#0d1117"/>
  <rect x="22" y="13" width="2" height="1" fill="#85b8ff"/>
  <rect x="24" y="13" width="1" height="1" fill="#6ea8fe"/>

  <!-- Row 14: Mouth -->
  <rect x="7" y="14" width="1" height="1" fill="#6ea8fe"/>
  <rect x="8" y="14" width="3" height="1" fill="#85b8ff"/>
  <rect x="11" y="14" width="1" height="1" fill="#0d1117"/>
  <rect x="12" y="14" width="8" height="1" fill="#85b8ff"/>
  <rect x="20" y="14" width="1" height="1" fill="#0d1117"/>
  <rect x="21" y="14" width="3" height="1" fill="#85b8ff"/>
  <rect x="24" y="14" width="1" height="1" fill="#6ea8fe"/>

  <!-- Row 15: Bottom snout -->
  <rect x="8" y="15" width="16" height="1" fill="#85b8ff"/>

  <!-- Row 16-17: Neck/upper body -->
  <rect x="7" y="16" width="18" height="1" fill="#6ea8fe"/>
  <rect x="6" y="17" width="20" height="1" fill="#6ea8fe"/>

  <!-- Row 18-21: Body -->
  <rect x="5" y="18" width="22" height="1" fill="#6ea8fe"/>
  <rect x="5" y="19" width="22" height="1" fill="#6ea8fe"/>
  <rect x="5" y="20" width="22" height="1" fill="#5a9aef"/>
  <rect x="6" y="21" width="20" height="1" fill="#5a9aef"/>

  <!-- Row 22-23: Lower body -->
  <rect x="6" y="22" width="20" height="1" fill="#5a9aef"/>
  <rect x="7" y="23" width="18" height="1" fill="#5a9aef"/>

  <!-- Row 24-26: Legs -->
  <rect x="8" y="24" width="3" height="1" fill="#5a9aef"/>
  <rect x="13" y="24" width="3" height="1" fill="#5a9aef"/>
  <rect x="17" y="24" width="3" height="1" fill="#5a9aef"/>
  <rect x="21" y="24" width="3" height="1" fill="#5a9aef"/>

  <rect x="8" y="25" width="3" height="1" fill="#5a9aef"/>
  <rect x="13" y="25" width="3" height="1" fill="#5a9aef"/>
  <rect x="17" y="25" width="3" height="1" fill="#5a9aef"/>
  <rect x="21" y="25" width="3" height="1" fill="#5a9aef"/>

  <!-- Feet -->
  <rect x="7" y="26" width="4" height="1" fill="#4a8ad8"/>
  <rect x="12" y="26" width="4" height="1" fill="#4a8ad8"/>
  <rect x="17" y="26" width="4" height="1" fill="#4a8ad8"/>
  <rect x="21" y="26" width="4" height="1" fill="#4a8ad8"/>

  <!-- Memory sparkles around the hippo -->
  <rect x="3" y="7" width="1" height="1" fill="#6ea8fe" opacity="0.7"/>
  <rect x="4" y="4" width="1" height="1" fill="#85b8ff" opacity="0.5"/>
  <rect x="28" y="6" width="1" height="1" fill="#6ea8fe" opacity="0.7"/>
  <rect x="27" y="3" width="1" height="1" fill="#85b8ff" opacity="0.5"/>
  <rect x="2" y="12" width="1" height="1" fill="#f0f6fc" opacity="0.3"/>
  <rect x="29" y="11" width="1" height="1" fill="#f0f6fc" opacity="0.3"/>
</svg>
